version: 2
updates:
  # Python - pip-compile manages requirements.txt from requirements.in
  # Dependabot will update requirements.in and re-run pip-compile to regenerate requirements.txt
  - package-ecosystem: "pip"
    directory: "/python-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # .NET
  - package-ecosystem: "nuget"
    directory: "/dotnet-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "dotnet"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      terraform-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "terraform"

  # GitHub Actions - will update SHA hashes and keep version comments in sync
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"

  # Node.js / pnpm - dependabot detects pnpm-lock.yaml automatically via the npm ecosystem
  - package-ecosystem: "npm"
    directory: "/nodejs-frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      nodejs-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "nodejs"

  # Go modules - go.sum contains hashes for all dependencies
  - package-ecosystem: "gomod"
    directory: "/golang-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      golang-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "golang"

  # Docker - will update image digest SHAs
  - package-ecosystem: "docker"
    directory: "/python-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      python-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/dotnet-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      dotnet-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/nodejs-frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      nodejs-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/golang-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      golang-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
