version: 2

registries:
  dockerhub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_PASSWORD }}

updates:
  # Python - uv manages dependencies via pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/python-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # .NET
  - package-ecosystem: "nuget"
    directory: "/dotnet-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "dotnet"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      terraform-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "terraform"

  # GitHub Actions - will update SHA hashes and keep version comments in sync
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"

  # Node.js / pnpm - dependabot detects pnpm-lock.yaml automatically via the npm ecosystem
  - package-ecosystem: "npm"
    directory: "/nodejs-frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      nodejs-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "nodejs"

  # Go modules - go.sum contains hashes for all dependencies
  - package-ecosystem: "gomod"
    directory: "/golang-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      golang-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "golang"

  # Docker - will update image digest SHAs
  - package-ecosystem: "docker"
    directory: "/python-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    registries:
      - dockerhub
    groups:
      python-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"

  # NOTE: mcr.microsoft.com (dotnet-app) is intentionally omitted here.
  # Dependabot's Docker updater is incompatible with the Microsoft Container Registry (MCR) API
  # and throws unknown_error when attempting to resolve digest updates for those images.
  # Renovate handles MCR image updates instead (see renovate.json).

  - package-ecosystem: "docker"
    directory: "/nodejs-frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    registries:
      - dockerhub
    groups:
      nodejs-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/golang-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      golang-docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
