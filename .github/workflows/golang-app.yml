name: Go App

on:
  push:
    branches: [main]
    paths:
      - "golang-app/**"
      - ".github/workflows/golang-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "golang-app/**"
      - ".github/workflows/golang-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang-app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: golang-app/go.mod
          cache-dependency-path: golang-app/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Build Docker image
        run: docker build -t golang-demo-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name golang-demo -p 8080:8080 golang-demo-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop golang-demo
