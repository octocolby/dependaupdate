name: Node.js Frontend

on:
  push:
    branches: [main]
    paths:
      - "nodejs-frontend/**"
      - ".github/workflows/nodejs-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "nodejs-frontend/**"
      - ".github/workflows/nodejs-frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs-frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('nodejs-frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t nodejs-frontend:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name nodejs-frontend -p 3000:3000 nodejs-frontend:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:3000/health
          docker stop nodejs-frontend
