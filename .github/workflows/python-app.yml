name: Python App

on:
  push:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Verify lock file is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run app smoke test
        run: uv run python -c "import app; print('App imports OK')"

      - name: Build Docker image
        run: docker build -t python-demo-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name python-demo -p 8080:8080 python-demo-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop python-demo
