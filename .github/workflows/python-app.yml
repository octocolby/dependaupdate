name: Python App

on:
  push:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run app smoke test
        run: python -c "import app; print('App imports OK')"

      - name: Build Docker image
        run: docker build -t python-demo-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name python-demo -p 8080:8080 python-demo-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop python-demo
