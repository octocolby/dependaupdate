name: Python App

on:
  push:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Verify lock file is up to date
        run: |
          pip-compile --generate-hashes --output-file=requirements.check.txt requirements.in
          diff requirements.txt requirements.check.txt || \
            (echo "requirements.txt is out of sync with requirements.in — run pip-compile --generate-hashes requirements.in" && exit 1)

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run app smoke test
        run: python -c "import app; print('App imports OK')"

      - name: Build Docker image
        run: docker build -t python-demo-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name python-demo -p 8080:8080 python-demo-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop python-demo
