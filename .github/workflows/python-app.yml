name: Python App

on:
  push:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-app/**"
      - ".github/workflows/python-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Verify lock file is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run app smoke test
        run: uv run python -c "import app; print('App imports OK')"

      - name: Build Docker image
        run: docker build -t python-demo-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name python-demo -p 8080:8080 python-demo-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop python-demo
