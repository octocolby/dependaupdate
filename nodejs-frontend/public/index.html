<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Frontend</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
    pre  { background: #f4f4f4; padding: 1rem; border-radius: 4px; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Demo Frontend</h1>
  <p>Node.js frontend &rarr; .NET backend</p>
  <button onclick="callApi()">Call .NET API</button>
  <pre id="output">Click the button to call the backend.</pre>

  <script>
    async function callApi() {
      const output = document.getElementById("output");
      try {
        const { url } = await fetch("/api-url").then(r => r.json());
        const data = await fetch(url).then(r => r.json());
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
